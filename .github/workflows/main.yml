name: Start RDP Tailscale

on:
  workflow_dispatch:
    inputs:
      tailscale_key:
        description: 'Tailscale Auth Key'
        required: true

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install & Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ github.event.inputs.tailscale_key }}
          version: latest

      - name: Enable RDP & Generate Random Password
        shell: powershell
        run: |
          # 1. Aktifkan Remote Desktop (RDP)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 2. Buat Password Acak Otomatis untuk runneradmin (12 Karakter)
          $password = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 12 | ForEach-Object {[char]$_})
          net user runneradmin "$password"

          # 3. Ambil IP Tailscale Runner
          $tsIp = (tailscale ip -4)

          # 4. Cetak Informasi Koneksi ke Log Actions
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "           RDP BERHASIL DIAKTIFKAN!" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host " IP Address : $tsIp" -ForegroundColor Yellow
          Write-Host " Username   : runneradmin" -ForegroundColor Yellow
          Write-Host " Password   : $password" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
