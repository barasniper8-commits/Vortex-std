name: Start RDP Tailscale

on:
  workflow_dispatch:
    inputs:
      tailscale_key:
        description: 'Tailscale Auth Key'
        required: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install & Connect Tailscale (Windows)
        shell: powershell
        run: |
          Write-Host "Menginstal Tailscale menggunakan winget..." -ForegroundColor Cyan
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements
          
          Write-Host "Menghubungkan ke Tailscale..." -ForegroundColor Cyan
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ github.event.inputs.tailscale_key }}" --unattended

      - name: Enable RDP & Generate Credentials
        shell: powershell
        run: |
          # 1. Aktifkan Remote Desktop (RDP)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 2. Buat Username Acak: 7 huruf (Depan huruf besar, sisanya huruf kecil)
          $upper = Get-Random -InputObject ([char[]]'ABCDEFGHIJKLMNOPQRSTUVWXYZ')
          $lower = -join (1..6 | ForEach-Object { Get-Random -InputObject ([char[]]'abcdefghijklmnopqrstuvwxyz') })
          $username = "$upper$lower"

          # 3. Buat Password Otomatis: Alpha-(4 angka acak)
          $randomDigits = -join (1..4 | ForEach-Object { Get-Random -Maximum 10 })
          $password = "Alpha-$randomDigits"

          # 4. Buat User Windows Baru dan tambahkan ke grup Administrator
          net user $username "$password" /add
          net localgroup administrators $username /add

          # 5. Ambil IP Tailscale Runner
          $tsIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          # 6. Simpan info ke rdp-info.json
          $info = @{
              ip = "$tsIp"
              username = "$username"
              password = "$password"
          } | ConvertTo-Json
          Set-Content -Path "rdp-info.json" -Value $info

          # 7. Push file info otomatis ke repository
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rdp-info.json
          git commit -m "Update RDP Connection Info [skip ci]"
          git push

          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "           RDP BERHASIL DIAKTIFKAN!" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host " IP Address : $tsIp" -ForegroundColor Yellow
          Write-Host " Username   : $username" -ForegroundColor Yellow
          Write-Host " Password   : $password" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

      - name: Keep RDP Alive (Menjaga Tetap Nyala)
        shell: powershell
        run: |
          Write-Host "RDP sedang berjalan. Sesi akan tetap aktif sampai waktu habis atau Anda membatalkan workflow." -ForegroundColor Green
          
          $maxMinutes = 360
          for ($i = 1; $i -le $maxMinutes; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "Menjaga koneksi tetap aktif... Menit ke-$i dari $maxMinutes"
          }
